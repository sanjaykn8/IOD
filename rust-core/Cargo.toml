[package]
name = "iod-core"
version = "0.1.0"
edition = "2021"
description = "Post-quantum secure Internet-of-Drones protocol core (no ECC)"

[lib]
name = "iod_core"
path = "src/lib.rs"

[[bin]]
name = "iod-server"
path = "src/bin/server.rs"

[[bin]]
name = "iod-vectors"
path = "src/bin/vectors.rs"

[[bin]]
name = "iod-bench"
path = "src/bin/bench.rs"

[dependencies]
# NOTE: pqcrypto-kyber / pqcrypto-dilithium implement the NIST Round-3
# submissions (Kyber768, Dilithium2) via PQClean C sources. They are the
# direct predecessors of the standardized ML-KEM-768 (FIPS 203) and
# ML-DSA-44 (FIPS 204) but are NOT byte-compatible with the final
# standards. They are kept because the existing protocol and vectors use
# them; migrating to pqcrypto-mlkem/pqcrypto-mldsa is listed as a TODO in
# docs/IMPLEMENTATION_STATUS.md and docs/dependency-rationale.md.
pqcrypto-kyber = "0.8.1"
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3"
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tiny_http = "0.12"
hex = "0.4"
thiserror = "1"
anyhow = "1"


# --- Transparent, hash-based STARK stack for the witness-hiding membership
# proof (see docs/zk-design.md). Plonky3 0.9.0-rc.1 with the hiding-FRI PCS
# (Habock, ePrint 2024/1037). No elliptic-curve crate is in this tree; the
# only primes involved are the BabyBear field and its degree-5 extension.
p3-air = "=0.9.0-rc.1"
p3-baby-bear = "=0.9.0-rc.1"
p3-challenger = "=0.9.0-rc.1"
p3-commit = "=0.9.0-rc.1"
p3-dft = "=0.9.0-rc.1"
p3-field = "=0.9.0-rc.1"
p3-fri = "=0.9.0-rc.1"
p3-keccak = "=0.9.0-rc.1"
p3-matrix = "=0.9.0-rc.1"
p3-merkle-tree = "=0.9.0-rc.1"
p3-poseidon2 = "=0.9.0-rc.1"
p3-poseidon2-air = "=0.9.0-rc.1"
p3-symmetric = "=0.9.0-rc.1"
p3-uni-stark = "=0.9.0-rc.1"
# Plonky3 uses rand 0.10; kept under a different name from our rand 0.8.
rand10 = { package = "rand", version = "0.10" }
postcard = { version = "1", features = ["use-std"] }
